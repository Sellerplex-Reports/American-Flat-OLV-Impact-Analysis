  .kpi-value.amber{color:var(--amber)}

  .chart-grid.three{grid-template-columns:1fr 1fr 1fr}

  .chart-container.tall{height:300px}
  .chart-container.short{height:220px}
  .chart-container.xtall{height:380px}
  .data-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto}

    white-space:nowrap;
    vertical-align:middle;
  }
  .data-table th:last-child{border-right:none}
  .data-table td{
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    color:var(--text);
    vertical-align:middle;
    white-space:nowrap;
  }

  .data-table tbody tr:last-child td{border-bottom:none}
  .data-table tbody tr:hover td{background:var(--surface2)}
  .data-table th.num{text-align:right}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .good{color:var(--green)}
  .accent-c{color:var(--accent)}
  .amb{color:var(--amber)}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
  .tag-promoted{background:#f59e0b22;color:var(--promoted);border:1px solid #f59e0b44}
  .tag-halo{background:#a78bfa22;color:var(--halo);border:1px solid #a78bfa44}
  .insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
  .insight-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:16px}

      <div class="insight-card a"><div class="il">Purchase Rate</div><div class="iv amber">${fmtX(prLift)} higher</div><div class="id">${fmtPct(prior.purchase_rate*100)} (Prior DSP) vs ${fmtPct(noprior.purchase_rate*100)} (No Prior DSP)</div></div>
      <div class="insight-card"><div class="il">Conversions / User</div><div class="iv accent-c">${fmtX(convLift)} higher</div><div class="id">${fmt(prior.total_conversions/prior.unique_users,1)} (Prior DSP) vs ${fmt(noprior.total_conversions/noprior.unique_users,1)} (No Prior DSP)</div></div>
    </div>
    <div class="callout" style="border-left:3px solid var(--amber)">
      <strong style="color:var(--text)">⚠️ Note on NTB rate:</strong> No Prior DSP Exposure shows a <em>higher</em> NTB purchase rate (${fmtPct(noprior.ntb_purchase_rate*100)}) than Prior DSP Exposure (${fmtPct(prior.ntb_purchase_rate*100)}). This is expected — users with prior DSP exposure are more likely to already be familiar with the brand, so a larger share of prior-DSP purchases come from existing customers, while DSP-unexposed traffic in this dataset skews more new-to-brand.
      <br><br><strong style="color:var(--cyan)">📊 Baseline for context:</strong> Sponsored Ads-exposed purchasers (no DSP) run at <strong style="color:var(--text)">${fmtPct(saBaseline.ntb_rate*100)}</strong> NTB — the standard baseline for this brand's paid traffic. Both DSP-exposure groups above sit below that Sponsored Ads baseline, with Prior DSP Exposure furthest below it.
    </div>
  </div>

  <div class="section">
    <div class="section-title">Group Comparison — Full Metrics</div>
    <div class="callout" style="border-left:3px solid var(--muted);margin-bottom:14px">
      <strong style="color:var(--text)">ℹ️ Reading the Lift column:</strong> Lift is only shown for rate/average metrics (Purchase Rate, NTB Purchase Rate, Avg. Sales / User), where a multiplier is a meaningful comparison. It's omitted for raw volume metrics (Unique Users, Conversions, Purchases, Sales, Units) since the two groups aren't the same size and a "lift" multiple on raw counts isn't a fair comparison.
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Metric</th>
          <th class="num" style="color:var(--accent)">Prior DSP Exposure</th>
          <th class="num" style="color:var(--muted)">No Prior DSP Exposure</th>
          <th class="num" style="color:var(--green)">Lift</th>
        </tr></thead>
        <tbody>
          <tr><td>Unique Users</td><td class="num">${fmt(prior.unique_users)}</td><td class="num">${fmt(noprior.unique_users)}</td><td class="num">—</td></tr>
          <tr><td>Total Conversions</td><td class="num">${fmt(prior.total_conversions)}</td><td class="num">${fmt(noprior.total_conversions)}</td><td class="num">—</td></tr>
          <tr><td>Purchases</td><td class="num">${fmt(prior.purchases)}</td><td class="num">${fmt(noprior.purchases)}</td><td class="num">—</td></tr>
          <tr><td>NTB Conversions</td><td class="num">${fmt(prior.ntb_conversions)}</td><td class="num">${fmt(noprior.ntb_conversions)}</td><td class="num">—</td></tr>
          <tr><td>Total Product Sales</td><td class="num">${fmtC0(prior.total_product_sales)}</td><td class="num">${fmtC0(noprior.total_product_sales)}</td><td class="num">—</td></tr>
          <tr><td>Total Units Sold</td><td class="num">${fmt(prior.total_units_sold)}</td><td class="num">${fmt(noprior.total_units_sold)}</td><td class="num">—</td></tr>
          <tr><td>Purchase Rate</td><td class="num">${fmtPct(prior.purchase_rate*100)}</td><td class="num">${fmtPct(noprior.purchase_rate*100)}</td><td class="num good">${fmtX(prior.purchase_rate/noprior.purchase_rate)}</td></tr>
          <tr><td>NTB Purchase Rate</td><td class="num">${fmtPct(prior.ntb_purchase_rate*100)}</td><td class="num">${fmtPct(noprior.ntb_purchase_rate*100)}</td><td class="num" style="color:var(--amber)">${fmtX(prior.ntb_purchase_rate/noprior.ntb_purchase_rate)}</td></tr>
          <tr><td>Avg. Sales / User</td><td class="num">${fmtC(prior.avg_sales_per_user,1)}</td><td class="num">${fmtC(noprior.avg_sales_per_user,1)}</td><td class="num good">${fmtX(spuLift)}</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Video Completers vs. Non-Completers — Audience Size by Order</div>
    <div class="callout" style="border-left:3px solid var(--cyan);margin-bottom:14px">
      <strong style="color:var(--text)">📋 What this shows:</strong> Of everyone who started watching the video, how many stuck through to 100% completion vs. dropped off early — pulled directly from DSP's video-event data per order. <strong style="color:var(--amber)">Note:</strong> this is audience size only, not downstream purchase behavior. We attempted to join this to purchase/conversion data per group, but the returned purchase figures didn't reconcile with this report's validated totals (they came back roughly 10× too high), so we're holding that comparison back until the query is corrected rather than publish numbers we don't trust. This chart is the reliable part of that data — the completion split itself.
    </div>
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>Order</th><th class="num">Completers (100%)</th><th class="num">Non-Completers</th><th class="num">Completion Share</th></tr></thead>
      <tbody id="completionSplitTbody"></tbody>
    </table></div>
    <div class="chart-grid" style="margin-top:16px">
      <div class="chart-card full"><div class="chart-title">Completers vs. Non-Completers by Order</div><div class="chart-container tall"><canvas id="deC5"></canvas></div></div>
    </div>
  </div>
  `;

  const cas = DATA.video_creative.completion_audience_split;
  $('completionSplitTbody').innerHTML = cas.map(c=>`
    <tr>
      <td>${c.order}</td>
      <td class="num good">${fmt(c.completers)}</td>
      <td class="num">${fmt(c.non_completers)}</td>
      <td class="num">${fmtPct(c.completion_share,1)}</td>
    </tr>`).join('');

  new Chart($('deC5'), {
    type:'bar',
    data:{ labels: cas.map(c=>c.order), datasets:[
      { label:'Completers (100%)', data:cas.map(c=>c.completers), backgroundColor:G, borderRadius:6 },
      { label:'Non-Completers', data:cas.map(c=>c.non_completers), backgroundColor:MU, borderRadius:6 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>fmtNK(v) } }, x:{ ticks:{ font:{size:10} } } } }
  });

  } catch(e){ console.error('DSP Exposure tab error', e); $('page-dspexp').innerHTML = '<div class="callout">Error rendering tab: '+e.message+'</div>'; }
})();


// ============================================================
// TAB 5: PATH TO CONVERSION
// ============================================================
(function(){
  try{
  const pg = DATA.path_groups;
  const page = $('page-paths');
  const spCR = pg.SP.conv_rate, dspCR = pg.DSP.conv_rate, sbCR = pg.SB ? pg.SB.conv_rate : 0;
  const crChange = (dspCR - spCR)/spCR*100;

  const cp = DATA.consolidated_paths;

  page.innerHTML = `
  <div class="callout" style="border-left:3px solid var(--cyan);margin-bottom:16px">
    <strong style="color:var(--text)">📋 Source:</strong> Path-to-conversion data filtered to the 3 selected OLV campaign orders, over the Jun 2 – Sep 22, 2026 window — the same scope as the rest of this report.
    <br><br><strong style="color:var(--amber)">Why does this cap out at 5 touchpoints?</strong> Checked this directly against the raw path data — every single path in this export, across all 519 unique path strings, tops out at 5 touchpoints; there isn't a single 6-or-more-touch path anywhere in the underlying file. That's a structural limit of the AMC path-to-conversion report itself (it groups and truncates journeys at a fixed max depth), not something we're cutting off on our end.
  </div>

  <div class="section">
    <div class="section-title">DSP Impact: SP-Only vs. DSP-Touched Paths</div>
    <div class="callout" style="border-left:3px solid var(--cyan);margin-bottom:16px">
      <strong style="color:var(--text)">🎯 Reading this table:</strong> Each pair compares an SP-base path against its DSP-enhanced equivalent (same SP backbone, DSP inserted at a different point in the journey), built directly from this dataset's real path-level data. Green = DSP improves the metric versus its paired SP-only baseline; red = it doesn't.
    </div>
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr>
        <th>Path</th>
        <th>Type</th>
        <th class="num">Users</th>
        <th class="num">Converting</th>
        <th class="num">Conv. Rate</th>
        <th class="num">Revenue ($)</th>
        <th class="num">Rev/Converter</th>
        <th class="num">CR Δ vs SP-Only</th>
      </tr></thead>
      <tbody id="dspImpactTbody"></tbody>
    </table></div>
  </div>

  <div class="section">
    <div class="section-title">SP-Only vs. DSP-Touched vs. SB-Touched — Aggregate Performance</div>
    <div class="chart-grid">
      <div class="chart-card"><div class="chart-title">Conversion Rate: SP-Only vs. DSP-Touched vs. SB-Touched</div><div class="chart-container short"><canvas id="cPtcCR"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">Revenue per Converter</div><div class="chart-container short"><canvas id="cPtcRPC"></canvas></div></div>
    </div>
    <div class="data-table-wrap" style="margin-top:16px"><table class="data-table">
      <thead><tr><th>Path Group</th><th class="num">Unique Paths</th><th class="num">Total Users</th><th class="num">Converting Users</th><th class="num">Avg Conv. Rate</th><th class="num">Total Revenue</th><th class="num">Avg Rev/Converter</th></tr></thead>
      <tbody>
        <tr><td><span style="color:var(--muted);font-weight:600">SP-Only Paths</span></td><td class="num">${fmt(pg.SP.unique_paths)}</td><td class="num">${fmt(pg.SP.users)}</td><td class="num">${fmt(pg.SP.converting)}</td><td class="num">${fmtPct(pg.SP.conv_rate,2)}</td><td class="num good">${fmtC0(pg.SP.revenue)}</td><td class="num">${fmtC(pg.SP.rev_per_conv)}</td></tr>
        <tr><td><span style="color:var(--cyan);font-weight:700">DSP-Touched Paths</span></td><td class="num">${fmt(pg.DSP.unique_paths)}</td><td class="num">${fmt(pg.DSP.users)}</td><td class="num">${fmt(pg.DSP.converting)}</td><td class="num">${fmtPct(pg.DSP.conv_rate,2)}</td><td class="num good">${fmtC0(pg.DSP.revenue)}</td><td class="num">${fmtC(pg.DSP.rev_per_conv)}</td></tr>
        ${pg.SB ? `<tr><td><span style="color:var(--purple);font-weight:600">SB-Touched Paths</span></td><td class="num">${fmt(pg.SB.unique_paths)}</td><td class="num">${fmt(pg.SB.users)}</td><td class="num">${fmt(pg.SB.converting)}</td><td class="num">${fmtPct(pg.SB.conv_rate,2)}</td><td class="num good">${fmtC0(pg.SB.revenue)}</td><td class="num">${fmtC(pg.SB.rev_per_conv)}</td></tr>` : ''}
      </tbody>
    </table></div>
    <div class="callout" style="border-left:3px solid ${crChange<0?'var(--red)':'var(--green)'};margin-top:12px">
      <strong style="color:var(--text)">📈 Key Finding:</strong> DSP-touched paths convert at <strong style="color:${crChange<0?'var(--red)':'var(--green)'}">${fmtPct(dspCR,2)}</strong> — ${crChange<0?`${Math.abs(crChange).toFixed(0)}% below`:`${crChange.toFixed(0)}% above`} the ${fmtPct(spCR,2)} SP-only rate — and produce ${fmtC(pg.DSP.rev_per_conv)} in revenue per converter.
    </div>
  </div>

  <div class="section">
    <div class="section-title">Consolidated Paths — DSP First-Touch vs. Everything Else</div>
    <div class="callout" style="border-left:3px solid var(--cyan);margin-bottom:16px">
      <strong style="color:var(--text)">📋 What changed:</strong> Instead of listing every exact sequence (e.g. "SP &gt; SD &gt; SP &gt; SB &gt; SP" as its own row, separate from "SP &gt; SD &gt; SB &gt; SP"), repeated back-to-back touches of the same channel are collapsed into one step (so "SP &gt; SP &gt; DSP &gt; DSP &gt; SB" reads as "SP &gt; DSP &gt; SB"), and all paths that collapse to the same pattern are grouped together. Split into two tables: paths where <strong style="color:var(--cyan)">DSP was the very first touch</strong> in the journey, and everything else — now with NTB included. <em style="color:var(--muted)">Note: total revenue here runs somewhat higher than the earlier version of this table since this export uses a broader revenue definition (likely including halo sales); volumes (users, converting users) reconcile closely with the original data, so path/channel patterns below are reliable.</em>
    </div>
    <div class="data-table-wrap">
      <div style="font-size:12px;font-weight:700;color:var(--cyan);margin:8px 0 6px">DSP First-Touch Paths</div>
      <table class="data-table">
        <thead><tr><th>Path (consolidated)</th><th class="num">Users</th><th class="num">Converting</th><th class="num">Conv. Rate</th><th class="num">Revenue</th><th class="num">Rev/Converter</th><th class="num">NTB Converting</th><th class="num">NTB Rate</th></tr></thead>
        <tbody id="ptcDspFirstTbody"></tbody>
      </table>
    </div>
    <div class="data-table-wrap" style="margin-top:16px">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 6px">Non-DSP First-Touch Paths</div>
      <table class="data-table">
        <thead><tr><th>Path (consolidated)</th><th class="num">Users</th><th class="num">Converting</th><th class="num">Conv. Rate</th><th class="num">Revenue</th><th class="num">Rev/Converter</th><th class="num">NTB Converting</th><th class="num">NTB Rate</th></tr></thead>
        <tbody id="ptcNonDspTbody"></tbody>
      </table>
    </div>
    <div class="chart-grid" style="margin-top:16px">
      <div class="chart-card full"><div class="chart-title">Users by Consolidated Path — DSP First-Touch Highlighted</div><div class="chart-container tall"><canvas id="cPtcConsolidated"></canvas></div></div>
      <div class="chart-card full"><div class="chart-title">NTB Rate by Consolidated Path (Top by Users)</div><div class="chart-container tall"><canvas id="cPtcNtb"></canvas></div></div>
    </div>
  </div>
  `;

  const spBaselineCR = pg.SP.conv_rate;
  const dspImpactRows = DATA.matched_pairs;

  const dspImpactTbody = $('dspImpactTbody');
  dspImpactRows.forEach((row, i) => {
    const [path, type, users, converting, cr, revenue, rpc] = row;
    const isDSP = type.includes('DSP');

    let delta = '';
    if (isDSP) {
      const pairedCR = dspImpactRows[i-1] ? dspImpactRows[i-1][4] : spBaselineCR;
      const pct = pairedCR ? ((cr - pairedCR) / pairedCR * 100) : 0;
      const good = pct >= 0;
      delta = `<span style="color:${good?'var(--green)':'var(--red)'};font-weight:700">${pct>=0?'+':''}${pct.toFixed(0)}%</span>`;
    }

    const pathStyle = isDSP ? `font-family:monospace;font-size:11px;color:${C};font-weight:600` : `font-family:monospace;font-size:11px;color:${MU}`;
    const typeTag = isDSP
      ? `<span style="font-size:10px;font-weight:700;color:${C};background:#22d3ee18;border:1px solid #22d3ee44;border-radius:10px;padding:2px 7px">${type}</span>`
      : `<span style="font-size:10px;font-weight:600;color:${MU};background:#7a8aaa18;border:1px solid #7a8aaa33;border-radius:10px;padding:2px 7px">${type}</span>`;
    const pathLen = path.split('>').length;
    const prevLen = i>0 ? dspImpactRows[i-1][0].split('>').length : null;
    const isPairStart = (i===0) || (pathLen !== prevLen);
    const borderTop = (isPairStart && i>0) ? 'border-top:2px solid var(--border)' : '';

    dspImpactTbody.insertAdjacentHTML('beforeend', `<tr style="${borderTop}">
      <td style="${pathStyle}">${path}</td>
      <td>${typeTag}</td>
      <td class="num">${fmt(users)}</td>
      <td class="num">${fmt(converting)}</td>
      <td class="num ${isDSP?'good':''}">${cr.toFixed(3)}%</td>
      <td class="num good">${fmtC0(revenue)}</td>
      <td class="num">${rpc?fmtC(rpc):'—'}</td>
      <td class="num">${delta}</td>
    </tr>`);
  });

  const renderConsolidatedRow = (p, color) => `<tr>
      <td style="font-family:monospace;font-size:11px;color:${color};font-weight:${p.dsp_first?'700':'400'}">${p.path}</td>
      <td class="num">${fmt(p.users)}</td>
      <td class="num">${fmt(p.converting)}</td>
      <td class="num ${p.conv_rate>3?'good':''}">${fmtPct(p.conv_rate,2)}</td>
      <td class="num good">${fmtC0(p.revenue)}</td>
      <td class="num">${p.rev_per_conv?fmtC(p.rev_per_conv):'—'}</td>
      <td class="num good">${fmt(p.ntb_converting)}</td>
      <td class="num" style="color:var(--green)">${fmtPct(p.ntb_rate,1)}</td>
    </tr>`;

  $('ptcDspFirstTbody').innerHTML = cp.dsp_first.map(p=>renderConsolidatedRow(p, C)).join('');
  $('ptcNonDspTbody').innerHTML = cp.non_dsp_first.map(p=>renderConsolidatedRow(p, MU)).join('');

  const consolidatedChartData = [...cp.dsp_first, ...cp.non_dsp_first].sort((a,b)=>b.users-a.users).slice(0,14);
  new Chart($('cPtcConsolidated'), {
    type:'bar',
    data:{ labels: consolidatedChartData.map(p=>p.path), datasets:[{ label:'Users', data:consolidatedChartData.map(p=>p.users), backgroundColor:consolidatedChartData.map(p=>p.dsp_first?C:'#7a8aaa77'), borderColor:consolidatedChartData.map(p=>p.dsp_first?C:MU), borderWidth:1, borderRadius:4 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>fmtNK(v) } }, x:{ ticks:{ font:{size:10} } } } }
  });

  new Chart($('cPtcNtb'), {
    type:'bar',
    data:{ labels: consolidatedChartData.map(p=>p.path), datasets:[{ label:'NTB Rate %', data:consolidatedChartData.map(p=>p.ntb_rate), backgroundColor:consolidatedChartData.map(p=>p.dsp_first?'#22c55eaa':'#22c55e55'), borderColor:G, borderWidth:1, borderRadius:4 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>v+'%' } }, x:{ ticks:{ font:{size:10} } } } }
  });

  new Chart($('cPtcCR'), {type:'bar', data:{labels:['SP Only','DSP-Touched','SB-Touched'], datasets:[{label:'Conv. Rate %', data:[spCR,dspCR,sbCR], backgroundColor:['#7a8aaa44','#22d3ee66','#a78bfa66'], borderColor:[MU,C,P], borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`Conv. Rate: ${c.raw.toFixed(2)}%`}}}, scales:{y:{grid:{color:'#252f4566'}, ticks:{callback:v=>v+'%'}, beginAtZero:true}}}});
  new Chart($('cPtcRPC'), {type:'bar', data:{labels:['SP Only','DSP-Touched','SB-Touched'], datasets:[{label:'Rev per Converter ($)', data:[pg.SP.rev_per_conv,pg.DSP.rev_per_conv,pg.SB?pg.SB.rev_per_conv:0], backgroundColor:['#7a8aaa44','#22d3ee66','#a78bfa66'], borderColor:[MU,C,P], borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`$${c.raw.toFixed(2)}`}}}, scales:{y:{grid:{color:'#252f4566'}, ticks:{callback:v=>'$'+v}}}}});
  } catch(e){ console.error("Paths tab error:", e); $('page-paths').innerHTML = '<div class="callout">Error rendering tab: '+e.message+'</div>'; }
})();

</script>
